# ABOUTME: CI workflow running the project's quality gate (lint, type-check, tests, build)
# ABOUTME: Runs on pull requests to main and pushes to main, on the pinned Node version
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` builds the native better-sqlite3 binding; ubuntu-latest ships
      # the required python3/make/g++ toolchain.
      - name: Install dependencies
        run: npm ci

      - name: Lint (fails if warnings exceed the ratchet)
        run: npm run lint:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
